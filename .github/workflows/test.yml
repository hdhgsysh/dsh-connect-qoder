name: test

# This repo keeps src/host + src/client as the sources and lib/ as VERSIONED BUILD
# OUTPUT: regenerated by `npm run build` and committed together with the sources.
# Versioned on purpose — the DSH marketplace's `github:` install source (a pnpm
# git-dep) must ship the host entry `lib/index.js` out of the box, with no
# build-script approval and no devDependency fetch. docs/issues/19 has the pnpm 11
# allowBuilds evidence chain and the four failure modes this fixes. The `build`
# job below enforces the invariant: a clean rebuild must reproduce the committed
# bytes, or the commit is stale.
#
# (Upstream had the opposite layout, where lib/*.js were themselves the committed
# sources. Since docs/issues/17 the sources live in src/ and the artifact is rebuilt
# from them; since docs/issues/19 the rebuilt artifact is versioned again.)
on:
  # Branch-filtered on purpose: a bare `push` also fires on TAG pushes, so
  # releasing a version started a second full run of the same tree (the tag and
  # the commit it points at are the same bytes — run 39301812153 vs 39301851697).
  # The commit that gets tagged has already been gated; the tag itself does not
  # change a single file. Same shape as the four sibling repos.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both lines the package declares support for. Node 24 is where
        # AbortSignal.any and the module mock hooks the tests rely on are stable.
        node: ['22.19', '24']
        # Windows is not redundant: the shim binds a loopback listener, the
        # catalog store relies on rename-over-existing, and the credential
        # reader shells out to PowerShell. Those behave differently elsewhere.
        #
        # It runs on ONE node line only. The platform difference is what this
        # axis buys; a second Windows job re-ran the same ~14-minute install and
        # the same 1270 assertions to re-learn the same fact. Node coverage is
        # still both lines — it just lives on ubuntu.
        os: [ubuntu-latest]
        include:
          - node: '22.19'
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` is REQUIRED here too, not only in the `build` job.
          # `npm test` runs `test/gate-mutations.test.js`, which asks the
          # bundle-behaviour probe to compare the committed `lib/` against a
          # baseline found by WALKING HISTORY. A shallow clone has no history to
          # walk, so the walk falls back to HEAD — the same artifact — and every
          # probe compares the bundle with itself. The probe refuses to pass on
          # that: a green step that compared nothing is not evidence, so it
          # fails with "FAIL (vacuous)" and names this line.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # `package-lock.json` is committed here, so the download cache has a
          # key that only moves when a dependency actually moves.
          cache: npm

      # `.npmrc` sets legacy-peer-deps: the `@deepseek-ai/*` peers are supplied
      # by the host at runtime and are not on the public registry, so npm's
      # automatic peer install would fail before reaching tsdown. The devDeps
      # now also include `jsdom`, `react` and `react-dom` — `test/card-dom.test.js`
      # renders the shipped card with them.
      - run: npm install --no-audit --no-fund

      # The global install below pulls dozens of `@deepseek-ai/dsh-*` packages —
      # thousands of files — and on windows-latest it took 773 s of an 1108 s
      # job (run 39277257312). Nothing in that tree changes between runs of the
      # same host version, so it is cached per (OS, node, host version).
      #
      # The prefix is moved off the runner image's own `node_modules` so the
      # cache holds ONLY the runtime we installed; restoring over npm/corepack
      # would tie this cache to a runner image revision. `npm root -g` follows
      # the prefix, which is exactly the probe `test/composer-pill.test.js`
      # uses, so the anchor the test reads moves with it.
      #
      # It is set as NPM_CONFIG_PREFIX, NOT via `npm config set prefix`:
      # windows-latest exports NPM_CONFIG_PREFIX=C:\npm\prefix, and an env var
      # outranks every npmrc. The first attempt wrote the user npmrc,
      # `npm root -g` kept answering C:\npm\prefix\node_modules, the install
      # landed there, and the cache step then logged "Path Validation Error …
      # does not exist, hence no cache is being saved" — a green job that
      # cached nothing. The env var is the one npm obeys on both images.
      - name: Point npm's global prefix at a cacheable directory
        shell: bash
        run: |
          PREFIX="$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'dsh-global')")"
          echo "NPM_CONFIG_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # The key carries the resolved host version, not a pinned constant: a new
      # upstream release invalidates the cache on its own, so the gate keeps
      # testing the host a fresh install would have given it.
      - name: Resolve the host version the slot-gate reads
        id: dsh-version
        shell: bash
        run: echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"

      # restore/save are split rather than the combined `actions/cache`, which
      # saves whatever the path holds at job teardown. That version persisted an
      # EMPTY directory whenever the install below failed (a registry blip is
      # enough), and a saved key is never overwritten — so one bad run would
      # leave every later run for the same host version restoring an empty shell
      # and paying the full install again, forever, with a cache that reports a
      # hit. Saving only when the anchor was actually found closes that.
      - name: Restore the cached DSH runtime
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: dsh-runtime-${{ runner.os }}-node${{ matrix.node }}-${{ steps.dsh-version.outputs.version }}

      # The slot-gate assertions in `test/composer-pill.test.js` (A–D) read the
      # HOST's own client bundles, which a bare runner does not have: the
      # `@deepseek-ai/*` peers come from the DSH runtime, not the public registry.
      # Without this step all four skip, and `node --test` counts a skip as a
      # pass — the gate would be green on CI while verifying nothing. The test
      # resolves this tree via `npm root -g`, so a global install is what it needs.
      #
      # Guarded on the anchor the test actually reads, NOT on `cache-hit`: the
      # cache is an optimisation, and a half-restored entry must not be able to
      # skip this step while the four assertions quietly go back to passing as
      # skips. If the anchor is missing, we install.
      - name: Install the DSH runtime the slot-gate reads
        id: dsh-runtime
        shell: bash
        run: |
          echo "npm root -g -> $(npm root -g)"
          ANCHOR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-base"
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "cached runtime already present: $ANCHOR"
          else
            npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; the slot-gate assertions will name the missing peer"
          fi
          # This, and only this, decides whether the cache is written: an anchor
          # still missing after the install means there is nothing worth saving,
          # and saving it anyway is the poisoned-key failure described above.
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the runtime anchor is still missing after install; the cache will not be saved"
          fi

      - name: Save the DSH runtime for the next run
        if: steps.dsh-cache.outputs.cache-hit != 'true' && steps.dsh-runtime.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: ${{ steps.dsh-cache.outputs.cache-primary-key }}

      # A bare checkout now carries the committed lib/ (docs/issues/19), but the
      # build still runs first: the tests that read lib/client.js assert against
      # the SHIPPED bundle on purpose (see test/client-bundle.test.js), and building
      # here rather than in a separate job keeps the matrix honest — every OS/Node
      # combination verifies the bundle it actually tested.
      - name: Build lib/ from src/
        run: npm run build

      # Typecheck and the two `any` audits run HERE rather than only in the
      # local `npm run verify` chain, because `npm test` cannot stand in for
      # them: the suite imports `src/**/*.ts` through Node's native type
      # stripping, which ERASES the annotations without checking a single one.
      # Without this step every strict option in tsconfig.json
      # (`noUncheckedIndexedAccess`, `noImplicitOverride`, …) and both any
      # budgets are enforced on developer machines only, and a type error or a
      # fresh `any` reaches a release with a fully green CI.
      - name: Typecheck
        run: npm run typecheck

      - name: No implicit any (second opinion for the compiler rule)
        run: npm run audit:any

      - name: No explicit any
        run: npm run audit:explicit:any

      # The test tree gets its own type program (tsconfig.test.json) because
      # `npm test` cannot stand in for a compiler: the suite imports
      # `src/**/*.ts` through Node's native type stripping, which erases the
      # annotations without checking a single one, and the `.js` test files
      # were not in any program at all. This step is the one that would notice
      # a broken import inside a test, a renamed export, or a test file that
      # quietly dropped out of the program.
      - name: The test tree is type-checked too
        run: npm run audit:test-types

      # The other half of the test tree's type gate: the files that have NOT
      # opted in are still checked, and their errors are counted. The count is
      # a budget that may only shrink, so a new test file cannot arrive with
      # type errors in it behind the file-count ratchet (13 files opted in is
      # a number a clean file inflates for free, and a file with sixty errors
      # can only lower it).
      - name: The test tree's type debt does not grow
        run: npm run audit:test-type-errors

      - name: Run tests
        run: npm test

      # Guards ALIGNMENT, not behaviour: every host peer range is scored against
      # ALL 36 published @deepseek-ai/dsh versions and compared to the committed
      # partition in `test/host-range.golden.json`. `peer-compat.test.js` above
      # checks the ranges against a 7-version hand-written table (the DECISION);
      # this checks them against the whole published universe (the WORLD), which
      # is how a newly published 0.2.2-rc.1 gets noticed instead of silently
      # landing inside a range nobody re-read.
      #
      # It is a separate step from `npm test` because it is intentionally NOT in
      # that glob: the file is `test/host-range.test.mjs`, and `npm test` runs
      # `test/*.test.js`. (It could join the glob — the universe is committed, so
      # there is no network — but it is a release-time question, not an edit-time
      # one, and a red run here means "go look at the version universe", which is
      # a different instruction from "your change broke a test".)
      #
      # No network: the universe is committed. The one network-touching piece —
      # the semver cross-check — probes the runtime installed two steps above via
      # `npm root -g`, and skips (not fails) when it is absent.
      #
      # Order matters: run the gate first, and only then say whether the golden
      # file is stale. Both can be red at once (a stale universe AND a range that
      # now scores differently), and the gate's message is the actionable one.
      - name: Host range covers the whole published universe
        shell: bash
        run: |
          node --test test/host-range.test.mjs
          node scripts/update-host-range.mjs --check

      # The market-entry gate: the submission copy under
      # awesome-dsh-plugin-submission/ is read with the SAME js-yaml the
      # marketplace parses it with, then checked against a mirror of the
      # market's entry rules (unknown key, url shape, name vs url, category out
      # of the 22 allowed, missing description.en, a locale the site does not
      # render, tarball shape). Those are REJECTIONS at review time, and they
      # are invisible to every other check in this job, because nothing else
      # reads the submission file.
      #
      # A separate step for the same reason as the host range above: the file
      # is `test/market-entry.test.mjs` and `npm test` runs `test/*.test.js`.
      # js-yaml is a devDependency (installed above), so the parse really
      # happens here instead of taking a SKIP path.
      - name: The submission copy still satisfies the market's entry rules
        run: npm run test:market-entry

      # Enforced as a FLOOR, not as a score: `test:coverage` carries
      # --test-coverage-lines/functions/branches set a little under the current
      # numbers, so a change that silently loses coverage fails the build while
      # an honest module split does not. A percentage still cannot say whether a
      # specific regression is defended — docs/KNOWN_GAPS.md remains the real
      # register, and raising a threshold is a one-line review, not a redesign.
      #
      # One job measures it. The floors are global numbers and the instrumented
      # run is a second full pass over the same 1270 assertions (~144 s each),
      # so repeating it per platform measured the same percentage four times.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:coverage

  # Separate job: proves the artifact is reproducible from a clean install, and
  # that the host bundle and the client bundle both rebuild without drift.
  build:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is REQUIRED, not a nicety. `verify:bundle` walks history
      # for the newest ref whose `lib/client.js` differs from the rebuilt one —
      # that is what turns a self-comparison into real regression evidence. A
      # default shallow clone (depth 1) has no history to walk, and the script
      # then falls back to `HEAD` and FAILS the step on purpose (a green step
      # that cannot fail is worse than no step). Depth 0 is the cheapest way to
      # keep the comparison meaningful.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Rebuild from src/
        run: npm run build

      # lib/ is versioned (docs/issues/19): the marketplace's `github:` install
      # ships these bytes as-is, so a stale commit is a silent break, not a
      # cosmetic drift. The rebuild above rewrote lib/; any difference from the
      # committed copy means the sources moved without regenerating the artifact
      # (or the artifact was hand-edited — AGENTS.md red line 3 forbids that).
      - name: The committed lib/ matches a fresh build
        run: git diff --exit-code -- lib

      # The build must also be byte-stable inside this environment: build twice
      # and require equality. That is what makes the freshness gate above
      # meaningful across machines — if a rebuild were not byte-stable, the
      # `git diff` check could not be trusted to point at a real drift.
      - name: The build is reproducible
        run: |
          cp -r lib lib.first
          npm run build
          diff -r lib.first lib

      # The bundle is judged on behaviour, not byte equality with a committed
      # file (docs/issues/17): every pure function in the card is called with
      # the whole argument pool and the results are compared against the built
      # bundle. The script prints the probe and call counts, so a count here
      # would only be a number to let rot.
      - name: The rebuild behaves like the bundle the tests ran against
        run: npm run verify:bundle

      - name: The host bundle matches its sources
        run: npm run verify:host
